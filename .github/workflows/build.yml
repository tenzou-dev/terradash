name: Build APK

# Jalankan manual dari tab Actions, atau otomatis saat push tag v* (mis. v1.0.4)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android build-tools + platform
        shell: pwsh
        run: |
          $tc = Join-Path $env:RUNNER_TEMP 'toolchain'
          $sdk = Join-Path $tc 'sdk'
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null

          $bt = Join-Path $env:RUNNER_TEMP 'build-tools.zip'
          $pf = Join-Path $env:RUNNER_TEMP 'platform.zip'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/build-tools_r34-windows.zip' -OutFile $bt
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-35_r02.zip' -OutFile $pf
          Expand-Archive -Path $bt -DestinationPath $sdk -Force
          Expand-Archive -Path $pf -DestinationPath $sdk -Force

          Get-ChildItem $sdk | Select-Object Name
          "TOOLCHAIN=$tc" >> $env:GITHUB_ENV

      - name: Siapkan keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) {
            throw "Secret KEYSTORE_BASE64 belum diisi. Buka Settings > Secrets and variables > Actions."
          }
          $path = Join-Path $env:RUNNER_TEMP 'terradash.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "KEYSTORE_PATH=$path" >> $env:GITHUB_ENV

      - name: Build APK
        shell: pwsh
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          $pass = if ($env:KS_PASS) { $env:KS_PASS } else { 'terradash' }
          & .\android\build.ps1 `
              -Toolchain $env:TOOLCHAIN `
              -Keystore $env:KEYSTORE_PATH `
              -StorePass $pass `
              -KeyAlias terradash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerraDash-apk
          path: android/dist/*.apk

      - name: Buat Release (kalau dipicu tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk
          generate_release_notes: true
